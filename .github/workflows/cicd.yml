name: CI/CD pipeline

on:
  push:
    branches:
      - master

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      imageName: ${{ steps.versioning.outputs.imageName }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute version and image name
        id: versioning
        run: |
          version=$(git rev-parse --short HEAD)
          repository="${GITHUB_REPOSITORY,,}"
          imageName="ghcr.io/${repository}:${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "imageName=${imageName}" >> "$GITHUB_OUTPUT"

          echo "## New version ${version}" >> "$GITHUB_STEP_SUMMARY"
          echo "## Image ${imageName}" >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    runs-on: ubuntu-latest
    needs: [versioning]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test .

  build-and-push:
    runs-on: ubuntu-latest
    needs: [versioning, unit-tests]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ needs.versioning.outputs.version }}
          tags: |
            ${{ needs.versioning.outputs.imageName }}

  api-tests:
    runs-on: ubuntu-latest
    needs: [versioning, build-and-push]
    permissions:
      contents: read
      packages: read

    services:
      backend:
        image: ${{ needs.versioning.outputs.imageName }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 8080:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Wait for API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs "${{ job.services.backend.id }}"
          exit 1

      - name: Run API tests
        run: go test ./test/apitests

  deploy-dev:
    runs-on: ubuntu-latest
    needs: [versioning, api-tests]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy-dev

      - name: Update deployed version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "${{ needs.versioning.outputs.version }}" > version.txt
          git add version.txt
          git commit -m "Deploy ${{ needs.versioning.outputs.version }}" || exit 0
          git push origin HEAD:deploy-dev
